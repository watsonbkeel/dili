server {
    listen 443 ssl;
    http2 on;
    server_name dili.bkeel.com;

    ssl_certificate /etc/letsencrypt/live/dili.bkeel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dili.bkeel.com/privkey.pem;
    ssl_session_timeout 20m;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 2026-09 腾讯云迁移：后端改为本机 systemd 服务 dili.service（127.0.0.1:13104）
    # 音频上传 <=6MB、图片 <=15MB（应用层也有校验）
    client_max_body_size 16m;
    error_log /var/log/nginx/dili-error.log info;

    # 运维自检接口不对公网开放
    location = /api/admin/check {
        return 404;
    }

    # 上传接口：先完整缓冲请求体再转发，避免移动网络慢速/中断上传把半截数据推给后端
    location ~ ^/api/(transcriptions|recognize)$ {
        proxy_pass http://127.0.0.1:13104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        client_body_buffer_size 1m;
        client_body_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:13104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        send_timeout 90s;
    }
}
