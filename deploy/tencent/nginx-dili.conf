# 独立站点：/etc/nginx/sites-available/dili.conf（或 conf.d/dili.conf）
# 只对外开放 80/443；13104 仅监听 127.0.0.1，3102（旧本地 ASR）不再需要。
# 证书路径按实际申请结果替换；首次无证书时先只启用 80 段用于 ACME 验证。

limit_req_zone $binary_remote_addr zone=dili_paid:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dili.bkeel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dili.bkeel.com;

    ssl_certificate     /etc/nginx/ssl/dili.bkeel.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dili.bkeel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dili_ssl:10m;

    # 录音 ≤60s wav 约 2MB；图片上限 15MB（后端再按类型限制）
    client_max_body_size 16m;
    client_body_timeout 30s;

    # 超时预算：小程序 uploadFile 75s > Nginx 70s > Node requestTimeout 90s(兜底) ；ASR SDK 15s×(1+1 次重试)
    proxy_connect_timeout 5s;
    proxy_send_timeout 70s;
    proxy_read_timeout 70s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/dili.access.log;
    error_log  /var/log/nginx/dili.error.log warn;

    # 付费接口额外一层 Nginx 限速（后端另有进程内限流与并发保护）
    location ~ ^/api/(transcriptions|recognize|assistant)$ {
        limit_req zone=dili_paid burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:13104;
    }

    # 管理自检接口不对公网开放（在服务器本机用 curl 127.0.0.1:13104 访问）
    location = /api/admin/check {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:13104;
    }
}
